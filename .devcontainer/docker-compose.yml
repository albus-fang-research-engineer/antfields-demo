services:
  antfields:
    # image: antfields:demo
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/pgokul/Albus/antfields-demo:/antfields
    gpus: all
    command: /bin/bash
